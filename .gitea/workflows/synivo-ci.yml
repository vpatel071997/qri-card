# PR quality gate.
#
# `main` (and `staging`) branch protection require these two status checks:
#   - synivo-ci / ci (pull_request)
#   - synivo-ci / enforce-source (pull_request)
# The workflow that produced them (the old synivo-ci.yml) was deleted, so no
# PR could satisfy the requirement and every API merge was blocked. This
# recreates it. The context name is "<workflow name> / <job id> (<event>)",
# so the `name:` and job ids below must stay exactly `synivo-ci`, `ci`,
# `enforce-source` to match the protected-branch config.
#
# `enforce-source` was a best-effort reconstruction — the original job's policy
# was not recoverable from git history, so it was rebuilt to guard the
# printed-card safety files. It now ALSO does what its name says: a PR into
# `main` must come from `staging`. Until 2026-08-01 nothing enforced that, and
# the check's name made it look like something did.
name: synivo-ci

on:
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        # Mirror the deploy job: test libs live in "dependencies", and the
        # Electron toolchain (devDependencies) pulls an SSH git dep that stalls
        # CI, so omit dev + optional.
        run: npm ci --omit=optional --omit=dev || npm install --omit=dev
      - name: Test (blocks merge on failure)
        env:
          CI: "true" # single, non-interactive run
        run: npm test -- --watchAll=false
      - name: Build (CRA)
        env:
          CI: "false" # don't fail the build on lint warnings
        run: npm run build

  enforce-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: main may only take staging
        # A merge into main publishes qr.synivo.com.au, and the only thing that
        # has been seen running is whatever is on staging.
        #
        # This runs for PRs into main AND staging (see the `on:` block), so the
        # base is checked in bash rather than with an `if:` expression — a PR
        # into staging from a feature branch is exactly the normal path and must
        # not fail here.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "main" ]; then
            echo "PR targets '$BASE_REF', not main — the source rule does not apply"
            exit 0
          fi
          if [ "$HEAD_REF" = "staging" ]; then
            echo "head branch is 'staging' — ok"
            exit 0
          fi
          echo "::error::PR into main comes from '$HEAD_REF', not 'staging'." >&2
          echo "Merge this branch into staging first, confirm it on" >&2
          echo "https://staging.qri-card.pages.dev, then raise staging -> main." >&2
          exit 1
      - name: Printed-card guardrails must not be removed
        # These files protect QR codes already printed for customers. Deleting
        # them would silently drop the safety net, so a PR that removes any of
        # them fails this required check. See CLAUDE.md / RUNBOOK.md.
        run: |
          set -e
          required=(
            "src/utils/vcard.ts"
            "src/utils/vcard.test.tsx"
            "src/utils/vCardFields.test.tsx"
            "src/utils/vcardTemplates.test.tsx"
            "src/components/VCardView.test.tsx"
            "src/App.test.tsx"
            "public/_redirects"
            "CLAUDE.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing printed-card guardrail: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Do not remove the files that protect already-printed cards."
            exit 1
          fi
          echo "All printed-card guardrails present."
